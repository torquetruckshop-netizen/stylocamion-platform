<!doctype html>
<html lang="es">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="theme-color" content="#07101f"/><title>Validar entradas | Stylo Camión</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="../styles.css"/></head>
<body><header class="topbar"><a class="brand" href="/evento/">STYLO CAMIÓN</a><nav><a href="/evento/">Entradas</a></nav></header><main class="single validator-page"><section class="panel validator"><p class="eyebrow">Control de acceso</p><h1>Validar entrada / Caja Ruta</h1><div class="row"><label>PIN de control<input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"/></label><label>Operador / puesto<input id="validator" autocomplete="name" placeholder="Ej. Puerta 1" value="Puerta 1"/></label></div><label>Código<input id="code" autocomplete="off" placeholder="SC-RF27-CAM-XXXX"/></label><div class="actions-row"><button class="secondary" id="lookup" type="button">Consultar</button><button class="primary" id="checkin" type="button">Registrar ingreso</button><button class="secondary" id="deliverBox" type="button">Entregar Caja Ruta</button></div><div class="scanner"><video id="video" class="hidden" playsinline></video><button class="secondary" id="scan" type="button">Escanear con cámara</button><p class="fineprint">Si el navegador no permite escanear, cargá el código manualmente.</p></div><div id="result" class="validation-result"></div></section></main><script src="./validar.js"></script></body></html>
