<!doctype html>
<html lang="es">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Entrada | Stylo Camión</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="./styles.css"/></head>
<body><main class="single ticket-page"><section class="panel confirmation"><p class="eyebrow">La Feria del Usado con Ruedas 2027</p><h1>Entrada / código de ingreso</h1><div id="ticketBox" class="ticket-box"></div><p class="fineprint">Presentá este código en el ingreso. El personal puede escanear el QR o cargar el código manualmente.</p></section></main>
<script>
const params=new URLSearchParams(location.search);const code=(params.get('code')||'').toUpperCase();const box=document.getElementById('ticketBox');async function loadTicket(){if(!code){box.innerHTML='<p class="status error">Falta código de entrada.</p>';return}const response=await fetch(`/api/evento/ticket?code=${encodeURIComponent(code)}`,{cache:'no-store'});const data=await response.json();if(!response.ok||!data.ok){box.innerHTML=`<p class="status error">${data.error||'Código no encontrado.'}</p>`;return}const ticket=data.ticket;const qrUrl=`https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(location.href)}`;box.innerHTML=`<div class="qr-wrap"><img alt="QR de ingreso" src="${qrUrl}"></div><div class="ticket-data"><span>Código</span><strong>${ticket.ticket_code}</strong><span>Producto</span><strong>${ticket.product_name}</strong><span>Titular</span><strong>${ticket.buyer_name}</strong>${ticket.vehicle_plate?`<span>Patente</span><strong>${ticket.vehicle_plate}</strong>`:''}<span>Estado</span><strong>${ticket.checked_in_at?'Ya registrado en ingreso':'Pagado / pendiente de ingreso'}</strong></div>`}loadTicket();
</script></body></html>
