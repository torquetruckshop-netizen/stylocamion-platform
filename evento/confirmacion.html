<!doctype html>
<html lang="es">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Confirmación | Stylo Camión</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="./styles.css"/></head>
<body><header class="topbar"><a class="brand" href="/evento/">STYLO CAMIÓN</a><nav><a href="/evento/">Comprar otra entrada</a></nav></header><main class="single"><section class="panel confirmation"><p class="eyebrow">Confirmación de compra</p><h1 id="statusTitle">Consultando pago...</h1><p id="statusText">Estamos verificando el estado de la operación.</p><div id="ticketBox" class="ticket-box hidden"></div><button class="secondary" id="refreshButton" type="button">Consultar nuevamente</button></section></main>
<script>
const params=new URLSearchParams(location.search);const orderId=params.get('order_id')||params.get('external_reference')||params.get('id');const paymentId=params.get('payment_id')||params.get('collection_id');const title=document.getElementById('statusTitle');const text=document.getElementById('statusText');const box=document.getElementById('ticketBox');const refresh=document.getElementById('refreshButton');
async function loadOrder(){if(!orderId){title.textContent='Falta el número de orden';text.textContent='No encontramos el identificador interno para consultar esta operación.';return}title.textContent='Consultando pago...';text.textContent='Verificando la operación con Mercado Pago.';box.classList.add('hidden');const qs=new URLSearchParams({order_id:orderId});if(paymentId)qs.set('payment_id',paymentId);const response=await fetch(`/api/evento/order?${qs.toString()}`,{cache:'no-store'});const data=await response.json();if(!response.ok||!data.ok){title.textContent='No pudimos confirmar la compra';text.textContent=data.error||'Probá consultar nuevamente en unos segundos.';return}const order=data.order;if(order.status==='paid'&&order.ticket_code){title.textContent='Compra aprobada';text.textContent='Este es el código que tenés que presentar en el ingreso.';const ticketUrl=order.ticket_url||`${location.origin}/evento/ticket.html?code=${encodeURIComponent(order.ticket_code)}`;const qrUrl=`https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(ticketUrl)}`;box.innerHTML=`<div class="qr-wrap"><img alt="QR de ingreso" src="${qrUrl}"></div><div class="ticket-data"><span>Código</span><strong>${order.ticket_code}</strong><span>Producto</span><strong>${order.product_name}</strong>${order.vehicle_plate?`<span>Patente</span><strong>${order.vehicle_plate}</strong>`:''}<a class="primary link-button" href="${ticketUrl}">Abrir entrada</a></div>`;box.classList.remove('hidden')}else{title.textContent='Pago pendiente de confirmación';text.textContent='Si ya pagaste, esperá unos segundos y consultá nuevamente. El webhook puede demorar.'}}
refresh.addEventListener('click',loadOrder);loadOrder();
</script></body></html>
