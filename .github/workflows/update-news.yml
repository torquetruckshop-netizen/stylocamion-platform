name: Actualizar y publicar Noticias Stylo Camion

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-noticias
  cancel-in-progress: true

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install feedparser

      - name: Actualizar noticias
        run: python scripts/update_news.py

      - name: Guardar cambios
        run: |
          git config user.name "stylo-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add noticias/data/news.json noticias/data/archive/
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos; se publica igualmente el contenido vigente."
          else
            git commit -m "Actualizar radar automático de noticias"
            git push
          fi

      - name: Configurar GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar Noticias para publicar
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./noticias

      - name: Publicar Noticias
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
