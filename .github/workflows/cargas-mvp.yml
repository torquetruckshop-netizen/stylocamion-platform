name: Cargas MVP

on:
  pull_request:
    paths:
      - 'cargas-mvp/**'
      - '.github/workflows/cargas-mvp.yml'
  push:
    branches:
      - agent/cargas-mvp-autonomo
    paths:
      - 'cargas-mvp/**'
      - '.github/workflows/cargas-mvp.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cargas-mvp/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
