name: Stylo Control

on:
  pull_request:
    paths:
      - 'stylo-control/**'
      - '.github/workflows/stylo-control.yml'
  push:
    branches:
      - agent/stylo-control-mvp
    paths:
      - 'stylo-control/**'
      - '.github/workflows/stylo-control.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stylo-control/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
