name: Ventas Intelligence
on:
  pull_request:
    paths:
      - 'ventas-intelligence/**'
      - '.github/workflows/ventas-intelligence.yml'
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ventas-intelligence/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
