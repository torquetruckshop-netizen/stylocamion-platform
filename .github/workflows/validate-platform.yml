name: Validate platform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check academia/app.js
          node --check academia/courses-base.js
          node --check academia/courses.js
      - name: Platform invariants
        run: node scripts/validate-platform.mjs
